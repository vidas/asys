[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asys-runtime"
version = "0.2.1"
description = "Filesystem jobs executed by ordinary programs"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
asys-runtime = "asys_runtime.cli:main"

[tool.setuptools]
packages = ["asys_runtime"]
